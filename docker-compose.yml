services:
  db:
    image: mariadb:11
    container_name: construction-journal-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: construction-journal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:3306/${DATABASE_NAME}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app        # исходники с хоста -> hot-reload
      - /app/node_modules      # анонимный volume: не даём Windows node_modules затереть linux-сборку
      - /app/generated         # то же самое для сгенерированного Prisma Client
    depends_on:
      db:
        condition: service_healthy

  # frontend:
  #   добавим после того, как пришлёшь настоящий frontend/package.json

volumes:
  db_data:
